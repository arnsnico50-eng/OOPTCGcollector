name: ooptcgcollector
description: One Piece Trading Card Game collection tracker app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'
  flutter: ">=3.13.0"

dependencies:
  flutter:
    sdk: flutter

  # UI & Navigation
  cupertino_icons: ^1.0.6
  go_router: ^12.1.3
  flutter_screenutil: ^5.9.0

  # State Management
  provider: ^6.1.1
  riverpod: ^2.4.9
  flutter_riverpod: ^2.4.9

  # Database
  sqflite: ^2.3.0
  path: ^1.8.3
  drizzle_flutter: ^0.2.0-rc.4

  # Networking
  dio: ^5.4.0
  retrofit: ^4.0.3
  json_annotation: ^4.8.1

  # ML Kit & Camera
  google_ml_kit: ^0.16.0
  camera: ^0.10.5+5
  mobile_scanner: ^3.5.6
  permission_handler: ^11.1.0

  # Image Handling
  cached_network_image: ^3.3.0
  photo_view: ^0.14.0

  # Local Storage
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.2.1
  logger: ^2.0.2+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

  # Code Generation
  build_runner: ^2.4.7
  retrofit_generator: ^8.0.4
  json_serializable: ^6.7.1
  drizzle_dev: ^0.2.0-rc.4
  hive_generator: ^2.0.1
  custom_lint: ^0.5.7

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/